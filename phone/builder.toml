# How VoipAppz Builder works on the phone app (kind = "app", a native app).
# `make dev` starts the Android emulator, installs and opens the app, and
# streams the emulator's screen (ws-scrcpy, port 8000); `page` shows that
# stream in Builder's pane beside the chat. `make stop` shuts the emulator.
[builder]
kind = "app"
name = "VoipAppz Phone"
setup_done = ".builder-setup-done"
start_timeout = 900
requires = ["make", "mise", "node", "npm", "git"]
port = 8000
health = "/"
stop = "stop"
page = "/#!action=stream&udid=emulator-5554&player=webcodecs&fitToScreen=true&ws=ws%3A%2F%2F127.0.0.1%3A8000%2F%3Faction%3Dproxy-adb%26remote%3Dtcp%253A8886%26udid%3Demulator-5554"

[[builder.actions]]
id = "test"
label = "Run tests"
make = "test"

[[builder.actions]]
id = "apk"
label = "Build Android app"
make = "apk"

[[builder.actions]]
id = "install"
label = "Install on my phone"
make = "install"
