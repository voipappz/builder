[package]
name = "builder-core"
version.workspace = true
edition = "2021"

[lib]
doctest = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bytes = "1.10.1"
base64 = "0.22"
dunce = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# The bridge to the voice bot's WebSocket.
bot-ws = { package = "tokio-tungstenite", version = "0.28", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
toml = "0.8"
dashmap = "6.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
anyhow = "1.0"
zip = { version = "7", features = ["deflate"] }
which = "8.0"
dirs = "5.0"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase", "jobapi2", "winnt", "processthreadsapi", "handleapi", "errhandlingapi", "fileapi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.23"
agent-client-protocol = "0.4.2"
async-trait = "0.1"
urlencoding = "2.1"
tempfile = "3"
