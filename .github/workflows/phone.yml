name: Phone

# The VoipAppz Phone app (phone/): the SIP tests and the Android app, with the
# tools from phone/mise.toml. Runs only when phone/ or this file changes.
on:
  push:
    branches: [main]
    paths: ['phone/**', 'core/**', 'cli/**', 'chat/**', 'scripts/e2e-phone*', 'Cargo.lock', '.github/workflows/phone.yml']
  pull_request:
    paths: ['phone/**', 'core/**', 'cli/**', 'chat/**', 'scripts/e2e-phone*', 'Cargo.lock', '.github/workflows/phone.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: phone

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          working_directory: phone
      - name: Android SDK packages
        run: mise run android-sdk
      - uses: gradle/actions/setup-gradle@v4
      - name: SIP tests
        run: make test
      - name: Android app
        run: make apk
      - uses: actions/upload-artifact@v4
        with:
          name: voipappz-phone-debug-apk
          path: phone/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-test-results
          path: phone/sip/build/test-results/
          if-no-files-found: ignore

  # The mobile development environment as Builder opens it: `make setup`
  # installs the tools (Java, Android SDK, emulator, ws-scrcpy), then
  # `make dev` boots the emulator, installs and opens the app and serves the
  # screen stream Builder shows beside the chat; the job checks the stream
  # answers and the app is in front, then `make stop`.
  dev-env:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: jdx/mise-action@v2
        with:
          working_directory: phone
      - uses: gradle/actions/setup-gradle@v4
      - name: make setup (install the tools)
        run: make setup
      - name: make dev (emulator, app, stream)
        run: |
          make dev > dev.log 2>&1 &
          timeout 900 sh -c 'until curl -fs -o /dev/null http://127.0.0.1:8000/; do sleep 5; done' || { tail -50 dev.log; exit 1; }
          mise exec -- adb -s emulator-5554 shell dumpsys activity activities | grep -m1 -E "ResumedActivity.*io.voipappz.phone" \
            || { tail -50 dev.log; exit 1; }
          echo "Stream answers on 127.0.0.1:8000 and the app is in front"
      - name: make stop
        if: always()
        run: make stop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dev-env-logs
          path: |
            phone/dev.log
            phone/build/emulator.log
          if-no-files-found: ignore

  # Builder with the phone project, as a user opens the Mobile platform:
  # Builder runs the phone's setup and make dev itself; Chromium then checks
  # the chat and the live phone in Builder's pane. See scripts/e2e-phone.sh.
  builder-phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: jdx/mise-action@v2
        with:
          working_directory: phone
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: chat/.nvmrc
      - name: Build the chat (chat/ into client/)
        working-directory: chat
        run: npm ci && npm run build
      - name: Chromium for the page check
        working-directory: chat
        run: npx playwright install --with-deps chromium
      - name: Builder with the phone project, end to end
        env:
          NODE_PATH: ${{ github.workspace }}/chat/node_modules
        run: scripts/e2e-phone.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: builder-phone
          path: ${{ runner.temp }}/builder-e2e-phone/builder.png
          if-no-files-found: ignore

  # The iPhone targets build only on a Mac (on Linux they are skipped), so
  # this job keeps iOS-only code and the Darwin dependencies honest.
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: iOS simulator tests and the shared framework
        # The runner's preinstalled Android SDK lets the Android plugin configure.
        run: ./gradlew --console=plain :sip:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64
