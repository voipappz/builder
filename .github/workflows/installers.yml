name: Installers

# Builds the VoipAppz Builder desktop app for Linux, Windows and macOS.
# Every run uploads the installers as workflow artifacts; a v* tag also
# attaches them to a draft GitHub release. Not code-signed yet, so Windows
# SmartScreen and macOS Gatekeeper will warn on first open.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'core/**'
      - 'cli/**'
      - 'desktop/**'
      - 'branding/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/installers.yml'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb, AppImage)
            platform: ubuntu-22.04
            bundles: deb,appimage
            artifact: voipappz-builder-linux
          - name: Windows (installer)
            platform: windows-latest
            bundles: nsis
            artifact: voipappz-builder-windows
          - name: macOS (Apple silicon)
            platform: macos-latest
            bundles: app,dmg
            artifact: voipappz-builder-macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        working-directory: desktop
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
