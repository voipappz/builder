name: Installers

# Builds the Windows installer (NSIS .exe) and the Linux packages (.deb for
# Ubuntu/Debian, AppImage for other distros). Every run uploads them as
# workflow artifacts; a v* tag also publishes them as the latest GitHub
# release. Not code-signed yet, so Windows SmartScreen will warn on first open.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'core/**'
      - 'cli/**'
      - 'desktop/**'
      - 'branding/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'client.ref'
      - 'scripts/client.sh'
      - '.github/workflows/installers.yml'

permissions:
  contents: write

jobs:
  build:
    name: Windows (installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: voipappz-builder-windows

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The chat client, built from voipappz/app at client.ref and embedded
      # by core/build.rs, so the installer needs no running app.
      # voipappz/app is private: a read-only deploy key (secret APP_DEPLOY_KEY)
      # behind the SSH alias github.com-app, so it never collides with another
      # repository's key on the same host.
      - name: voipappz/app deploy key
        shell: bash
        env:
          KEY: ${{ secrets.APP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/voipappz-app && chmod 600 ~/.ssh/voipappz-app
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host github.com-app\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/voipappz-app\n  IdentitiesOnly yes\n' >> ~/.ssh/config
      - name: Build the chat client
        shell: bash
        env:
          APP_REPO: git@github.com-app:voipappz/app.git
        run: scripts/client.sh

      - name: Verify Windows startup
        run: cargo test --locked -p builder-core launcher::tests --lib

      - name: Build
        working-directory: desktop
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -maxdepth 2 -type f \
            -name '*.exe' \
            -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: voipappz-builder-windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (deb, AppImage)
    # 22.04: the oldest supported Ubuntu, so the .deb's glibc and WebKitGTK
    # needs are met on 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: voipappz-builder-linux

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: WebKitGTK and the bundlers' tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf file

      # voipappz/app is private: a read-only deploy key (secret APP_DEPLOY_KEY)
      # behind the SSH alias github.com-app, so it never collides with another
      # repository's key on the same host.
      - name: voipappz/app deploy key
        shell: bash
        env:
          KEY: ${{ secrets.APP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/voipappz-app && chmod 600 ~/.ssh/voipappz-app
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host github.com-app\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/voipappz-app\n  IdentitiesOnly yes\n' >> ~/.ssh/config
      - name: Build the chat client
        env:
          APP_REPO: git@github.com-app:voipappz/app.git
        run: scripts/client.sh

      - name: Build
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage

      - name: Collect packages
        run: |
          mkdir -p dist
          find target/release/bundle -maxdepth 2 -type f \( -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: voipappz-builder-linux
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: dist/*
