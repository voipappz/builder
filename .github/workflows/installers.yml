name: Installers

# Builds only the Windows desktop installer to conserve CI resources.
# Every run uploads the installers as workflow artifacts; a v* tag also
# publishes them as the latest GitHub release. Not code-signed yet, so Windows
# SmartScreen will warn on first open.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'core/**'
      - 'cli/**'
      - 'desktop/**'
      - 'branding/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/installers.yml'

permissions:
  contents: write

jobs:
  build:
    name: Windows (installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: voipappz-builder-windows

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Windows startup
        run: cargo test --locked -p builder-core launcher::tests --lib

      - name: Build
        working-directory: desktop
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -maxdepth 2 -type f \
            -name '*.exe' \
            -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: voipappz-builder-windows
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: dist/*
