[package]
name = "builder-cli"
version.workspace = true
edition = "2021"

[[bin]]
name = "voipappz-builder"
path = "src/main.rs"

[dependencies]
builder-core = { path = "../core" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
